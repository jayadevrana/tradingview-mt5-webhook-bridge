[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv2mt5-bridge"
version = "0.1.0"
description = "Windows desktop bridge from TradingView webhooks to MetaTrader 5."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "TV2MT5 Bridge Team" }]
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn>=0.34,<0.35",
  "pydantic>=2.11,<2.12",
  "pydantic-settings>=2.10,<2.11",
  "sqlalchemy>=2.0.40,<2.1",
  "psutil>=7.0,<7.1",
  "PySide6>=6.8,<6.9",
  "MetaTrader5>=5.0.45; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.5",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.12,<0.13",
  "mypy>=1.16,<1.17",
  "types-psutil>=7.0.0.20250601",
  "pyinstaller>=6.11,<6.12",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
